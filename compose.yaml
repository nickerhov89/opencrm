services:
  opencrm:
    build: .
    image: opencrm:local
    ports:
      - "127.0.0.1:${OPENCRM_PORT:-3001}:3001"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      OPENCRM_WEBHOOK_ALLOWED_HOSTS: ${OPENCRM_WEBHOOK_ALLOWED_HOSTS:-}
    volumes:
      - opencrm_data:/app/data
      - opencrm_backups:/app/backups
    restart: unless-stopped

volumes:
  opencrm_data:
  opencrm_backups:
