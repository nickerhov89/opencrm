# OpenCRM + PostgreSQL. Put POSTGRES_PASSWORD (letters and digits) into .env next to this file:
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
x-database-url: &database-url postgresql://opencrm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/opencrm
# Container logs are rotated: at most 5 files of 10 MB per service, so a flood of requests or errors
# cannot fill the disk (Docker keeps json-file logs without a size limit by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    logging: *logging
    environment:
      POSTGRES_DB: opencrm
      POSTGRES_USER: opencrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=ru-RU
    volumes:
      - opencrm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrm -d opencrm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  opencrm:
    build: .
    logging: *logging
    image: opencrm:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPENCRM_PORT:-3001}:3001"
    environment:
      DATABASE_URL: *database-url
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ATTACHMENT_QUOTA_MB: ${ATTACHMENT_QUOTA_MB:-10240}
      ATTACHMENT_USER_QUOTA_MB: ${ATTACHMENT_USER_QUOTA_MB:-2048}
      OPENCRM_WEBHOOK_ALLOWED_HOSTS: ${OPENCRM_WEBHOOK_ALLOWED_HOSTS:-}
      # After a move from amoCRM: with these set, the card history is loaded from amoCRM once after start.
      AMO_BASE_URL: ${AMO_BASE_URL:-}
      AMO_ACCESS_TOKEN: ${AMO_ACCESS_TOKEN:-}
      AMO_PROXY_URL: ${AMO_PROXY_URL:-}
      AMO_RPS: ${AMO_RPS:-3}
      # amoCRM ⇄ OpenCRM sync while both run (server/amocrm-sync.js): off | dry_run | amo_to_opencrm | both.
      AMOCRM_SYNC_MODE: ${AMOCRM_SYNC_MODE:-off}
      AMOCRM_SYNC_PRIMARY: ${AMOCRM_SYNC_PRIMARY:-amo}
      AMOCRM_SYNC_SINCE: ${AMOCRM_SYNC_SINCE:-}
      AMOCRM_SYNC_INTERVAL_SEC: ${AMOCRM_SYNC_INTERVAL_SEC:-60}
      AMOCRM_SYNC_OVERLAP_SEC: ${AMOCRM_SYNC_OVERLAP_SEC:-120}
      AMOCRM_SYNC_DEFAULT_OWNER_ID: ${AMOCRM_SYNC_DEFAULT_OWNER_ID:-}
    volumes:
      - opencrm_data:/app/data
    restart: unless-stopped

  # Daily pg_dump + copy of attachments; the newest BACKUP_KEEP copies stay on this host and,
  # with BACKUP_S3_BUCKET set, every copy is also uploaded to S3-compatible storage.
  # BACKUP_KEEP=0 keeps nothing here: a copy is deleted locally once S3 confirms it.
  backup:
    image: opencrm:local
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/backup.mjs", "schedule", "/app/backups"]
    environment:
      DATABASE_URL: *database-url
      # Daily at BACKUP_AT (HH:MM) in BACKUP_TZ; with BACKUP_AT empty, every BACKUP_INTERVAL_HOURS.
      BACKUP_AT: ${BACKUP_AT:-00:00}
      TZ: ${BACKUP_TZ:-Europe/Moscow}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-opencrm}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_KEEP_DAYS: ${BACKUP_S3_KEEP_DAYS:-30}
      BACKUP_S3_ENCRYPTION_PASSWORD: ${BACKUP_S3_ENCRYPTION_PASSWORD:-}
    volumes:
      # Read-write only so that restore-s3 can put attachments back.
      - opencrm_data:/app/data
      - opencrm_backups:/app/backups
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  opencrm_pg:
  opencrm_data:
  opencrm_backups:
