name: Bug report
description: Report a reproducible problem with OpenCRM
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove customer data, passwords, and tokens before submitting. Report security vulnerabilities privately as described in SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use fictional data and give the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OpenCRM version, Node.js version, npm or Docker, browser.
    validations:
      required: true
