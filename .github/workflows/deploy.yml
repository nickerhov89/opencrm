name: Deploy

# Every push to main is tested and then deployed to the production server:
# the code is sent over SSH to a restricted key that can only run /opt/opencrm-deploy/deploy.sh,
# which rebuilds the image and restarts the compose project "opencrm".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 139.60.162.24
      # Server host key, pinned so the deploy cannot be redirected to another machine.
      DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGJUxmzADhlR7c6L5exC+ED/RoGOHBsr2/88qiJwMg5M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.OPENCRM_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::Secret OPENCRM_DEPLOY_KEY is not set"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_HOST $DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          mkdir -p release && git archive HEAD | tar -x -C release && echo "$GITHUB_SHA" > release/.revision
          tar -czf - -C release . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 root@"$DEPLOY_HOST"
